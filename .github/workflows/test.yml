name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m py_compile scripts/kb.py scripts/kb_core.py scripts/gmail_thread_to_event.py scripts/test_kb.py
      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/test_kb.py
      - name: Validate JSON schemas and examples
        shell: bash
        run: |
          for file in references/*.schema.json assets/*.json; do
            python -m json.tool "$file" >/dev/null
          done
      - name: Check CLI
        run: python scripts/kb.py --help
